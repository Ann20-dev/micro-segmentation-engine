# Deploy the app to Kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: micro-segmentation-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: micro-segmentation-engine
  template:
    metadata:
      labels:
        app: micro-segmentation-engine
    spec:
      containers:
      - name: app
        image: micro-segmentation-engine:latest
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: micro-segmentation-engine-service
spec:
  selector:
    app: micro-segmentation-engine
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer