<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efe6;
      --panel: #fffaf2;
      --ink: #1b1f23;
      --muted: #59636e;
      --line: #d9ccba;
      --accent: #155eef;
      --danger: #b42318;
      --success: #067647;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top left, #fff7df 0, transparent 32%),
        linear-gradient(135deg, #f4efe6, #efe4d2);
      color: var(--ink);
      min-height: 100vh;
    }
    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 20px 64px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(38, 30, 20, 0.08);
      padding: 24px;
      margin-bottom: 20px;
    }
    h1, h2 { margin-top: 0; }
    p { line-height: 1.5; }
    .meta { color: var(--muted); }
    .banner {
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-weight: 600;
    }
    .build-tag {
      display: inline-block;
      margin-bottom: 14px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #fff8eb;
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 0.92rem;
      font-weight: 700;
    }
    .allow { background: #e7f6ec; color: var(--success); }
    .deny { background: #fdecea; color: var(--danger); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }
    .tile {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      background: #fff;
    }
    label { display: block; margin-bottom: 12px; font-weight: 700; }
    input {
      width: 100%;
      margin-top: 6px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      background: #fff;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    button, .button {
      display: inline-block;
      text-decoration: none;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      padding: 11px 16px;
      font: inherit;
      cursor: pointer;
    }
    .button.secondary {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .button.danger, button.danger { background: var(--danger); }
    .button.ghost, button.ghost {
      background: #fff8eb;
      color: var(--ink);
      border: 1px dashed var(--line);
    }
    .chat-shell {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(240px, 0.8fr);
      gap: 20px;
    }
    .chat-stage {
      background: linear-gradient(180deg, #fffdf9, #fff6ea);
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(38, 30, 20, 0.1);
    }
    .chat-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
      background: linear-gradient(120deg, #1d4ed8, #0f766e);
      color: #fff;
    }
    .chat-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-orb {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff7cc, #f59e0b);
      box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.4);
    }
    .chat-log {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: 420px;
      overflow-y: auto;
      background:
        radial-gradient(circle at top right, rgba(21, 94, 239, 0.07), transparent 30%),
        linear-gradient(180deg, #fffcf7, #fff7ed);
    }
    .bubble {
      max-width: 78%;
      padding: 14px 16px;
      border-radius: 18px;
      line-height: 1.45;
      box-shadow: 0 10px 24px rgba(38, 30, 20, 0.08);
    }
    .bubble.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #155eef, #5b8cff);
      color: #fff;
      border-bottom-right-radius: 6px;
    }
    .bubble.bot {
      align-self: flex-start;
      background: #fff;
      color: var(--ink);
      border: 1px solid #e6d8c4;
      border-bottom-left-radius: 6px;
    }
    .bubble.system {
      align-self: center;
      background: #fff8eb;
      color: var(--muted);
      border: 1px dashed var(--line);
      box-shadow: none;
      font-size: 0.95rem;
    }
    .bubble.bot strong {
      display: block;
      margin-bottom: 6px;
      color: #0f766e;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .chat-composer {
      padding: 18px 20px 20px;
      border-top: 1px solid var(--line);
      background: #fffaf2;
    }
    .chat-composer textarea {
      width: 100%;
      min-height: 96px;
      resize: vertical;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      font: inherit;
      background: #fff;
    }
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      padding: 9px 12px;
      font: inherit;
      cursor: pointer;
    }
    .composer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .chat-status {
      color: var(--muted);
      font-size: 0.95rem;
    }
    .typing-indicator {
      display: none;
      align-self: flex-start;
      gap: 5px;
      padding: 12px 14px;
    }
    .typing-indicator.visible {
      display: inline-flex;
    }
    .typing-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
      animation: blink 1.1s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }
    .chat-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .insight-list {
      display: grid;
      gap: 10px;
    }
    .insight-item {
      padding: 12px 14px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid var(--line);
    }
    .banner {
      animation: slideIn 0.5s ease-out;
    }
    @keyframes slideIn {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .tile.safe {
      border-color: #067647;
      background: #f0fdf4;
    }
    .tile.warning {
      border-color: #d97706;
      background: #fffbeb;
    }
    .tile.blocked {
      border-color: #b42318;
      background: #fef2f2;
    }
    .status-indicator {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
    .status-indicator.normal {
      background: #e7f6ec;
      color: #067647;
    }
    .status-indicator.blocked {
      background: #fdecea;
      color: #b42318;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    @keyframes blink {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
      40% { transform: translateY(-3px); opacity: 1; }
    }
    .side-stack {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    @media (max-width: 760px) {
      .chat-shell {
        grid-template-columns: 1fr;
      }
      .bubble {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    {% block body %}{% endblock %}
  </div>
    <script>
    function useLatestOtp() {{
      const otpInput = document.querySelector('input[name="otp_code"]');
      const otpSource = document.querySelector('[data-latest-otp]');
      if (!otpInput || !otpSource) {{
        return;
      }}
      otpInput.value = otpSource.getAttribute('data-latest-otp') || '';
      otpInput.focus();
    }}

    document.addEventListener('DOMContentLoaded', function() {{
      const form = document.getElementById('chat-form');
      const textarea = form ? form.querySelector('textarea[name="message"]') : null;
      const status = document.getElementById('chat-status');
      const typing = document.getElementById('typing-indicator');
      const log = document.querySelector('.chat-log');
      const quickButtons = document.querySelectorAll('[data-quick-message]');

      function appendBubble(kind, message) {{
        if (!log) {{
          return;
        }}
        const bubble = document.createElement('div');
        bubble.className = 'bubble ' + kind;
        bubble.innerHTML = message;
        log.appendChild(bubble);
        log.scrollTop = log.scrollHeight;
      }}

      function fallbackSubmit(message) {{
        const fallbackForm = document.createElement('form');
        fallbackForm.method = 'POST';
        fallbackForm.action = '/chat-message';

        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'message';
        input.value = message;
        fallbackForm.appendChild(input);

        document.body.appendChild(fallbackForm);
        fallbackForm.submit();
      }}

      quickButtons.forEach(function(button) {{
        button.addEventListener('click', function() {{
          if (!textarea) {{
            return;
          }}
          textarea.value = button.getAttribute('data-quick-message') || '';
          textarea.focus();
        }});
      }});

      if (textarea) {{
        textarea.addEventListener('keydown', function(event) {{
          if (event.key === 'Enter' && !event.shiftKey) {{
            event.preventDefault();
            form.requestSubmit();
          }}
        }});
      }}

      if (form) {{
        form.addEventListener('submit', async function(e) {{
          e.preventDefault();
          const formData = new FormData(this);
          const userMessage = (formData.get('message') || '').toString().trim();
          if (!userMessage) {{
            return;
          }}
          formData.append('ajax', 'yes');
          appendBubble('user', userMessage);
          if (textarea) {{
            textarea.value = '';
            textarea.focus();
          }}
          if (typing) {{
            typing.classList.add('visible');
          }}
          if (status) {{
            status.textContent = 'Assistant is thinking...';
          }}
          try {{
            const response = await fetch('/chat-message', {{
              method: 'POST',
              body: formData,
              credentials: 'same-origin',
              headers: {{
                'Accept': 'application/json'
              }}
            }});
            const contentType = response.headers.get('content-type') || '';
            if (!response.ok || !contentType.includes('application/json')) {{
              throw new Error('Non-JSON chat response');
            }}
            const data = await response.json();
            if (typing) {{
              typing.classList.remove('visible');
            }}
            if (status) {{
              status.textContent = 'Assistant responded just now.';
            }}
            appendBubble('bot', data.bot);
          }} catch (error) {{
            if (typing) {{
              typing.classList.remove('visible');
            }}
            if (status) {{
              status.textContent = 'Live chat retrying...';
            }}
            appendBubble('system', 'Live response retried through the safe server path.');
            fallbackSubmit(userMessage);
            console.error('Error sending message:', error);
          }}
        }});
      }}
    }});
  </script>
</body>
</html>
